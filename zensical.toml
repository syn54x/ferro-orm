[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://docs.pydantic.dev/latest/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_options = { ignore_init_summary = true }
merge_init_into_class = true
show_source = false
show_root_heading = true
show_root_full_path = false
show_category_heading = false
# A member with no docstring is not rendered; every public object has one.
show_if_no_docstring = false
members_order = "source"
# Not "public": griffe counts every dunder as public, so "public" would render
# __repr__, __post_init__ and the __ferro_*__ class attributes. A protocol a
# reader uses (async with, len(), comparisons) belongs in the class docstring.
# `model_config` is Pydantic's configuration, inherited with Pydantic's own
# docstring; it is no part of a Ferro model's API.
filters = ["!^_", "!^model_config$"]
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
show_symbol_type_heading = true
show_symbol_type_toc = true
scoped_crossrefs = true
relative_crossrefs = true
summary = true
backlinks = "tree"
extensions = ["griffe_inherited_docstrings"]

# --- Python-Markdown core ---
[project.markdown_extensions.abbr]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.admonition]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true
permalink_title = "Anchor link to this section"

# --- pymdown-extensions ---
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.magiclink]
provider = "github"
user = "syn54x"
repo = "ferro-orm"
repo_url_shorthand = true
repo_url_shortener = true
normalize_issue_symbols = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
# Example sections sit inside `async def main():`; strip that indentation so
# an embedded block starts at column 0 and runs when pasted.
dedent_subsections = true
# The glossary lives outside docs_dir so it is not built as a page.
auto_append = ["docs/includes/abbreviations.md"]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
