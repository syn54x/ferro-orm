# Pre-commit hooks configuration for Ferro
# Compatible with both pre-commit and Prek
#
# Every hook below runs at the pre-commit stage (and under
# `prek run --all-files`, which CI runs); commitizen alone runs at commit-msg.
default_stages: [pre-commit]

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Python formatting and linting with Ruff.
  # Keep `rev` equal to the ruff version `uv.lock` records, so this hook and
  # `uv run ruff` format and lint identically. Pinned here rather than run
  # through the project environment because CI's lint job syncs only the
  # `ci-lint` group (prek), and the pinned hook is cached on this file's hash.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Rust formatting
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
      # The whole workspace, tests included: the same command as
      # `cargo clippy --workspace --all-targets -- -D warnings`.
      - id: clippy
        args: [--workspace, --all-targets, --, -D, warnings]

  # Conventional commit enforcement
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Python type checking (optional, can be enabled if needed)
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.8.0
  #   hooks:
  #     - id: mypy
  #       additional_dependencies: [types-all]
  #       args: [--ignore-missing-imports]
